# Dữ liệu cho trang /cv/. Mỗi mục trong "sections" là một khối trên trang CV.
# Xoá bớt hoặc thêm mục đều được — trang tự sinh lại theo file này.
# TODO: điền đầy đủ thông tin thật; các chỗ để trống "" là chỗ cần bổ sung.

